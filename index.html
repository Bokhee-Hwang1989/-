<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>금촌가정교회 - 스마트 출석부 (저장 버전)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f0f4f0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.8)), 
                              url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&q=80&w=2560');
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
        }
        .member-card { 
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); 
            background: rgba(255, 255, 255, 0.75);
            display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 120px;
        }
        .present { background: white; border-color: #f59e0b; color: #92400e; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(245,158,11,0.2); }
        .new-badge { position: absolute; top: -5px; left: -5px; background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body class="pb-10">

    <nav class="sticky top-0 z-50 bg-white/85 backdrop-blur-md border-b border-amber-100 px-8 py-4">
        <div class="max-w-[1600px] mx-auto flex flex-wrap items-center justify-between gap-6">
            <div>
                <h1 class="text-2xl font-black text-slate-900 tracking-tight"><span class="text-nature-primary"><i class="fas fa-sun"></i></span> 금촌가정교회</h1>
                <p id="live-clock" class="text-nature-primary font-black text-xl mt-1">00:00:00</p>
            </div>

            <div class="flex-1 max-w-md">
                <div class="relative">
                    <input type="text" id="self-member-name" placeholder="새식구님 성함을 입력해 주세요" class="w-full border-2 border-amber-100 px-6 py-4 rounded-2xl outline-none focus:border-nature-primary font-bold">
                    <button onclick="selfRegister()" class="absolute right-2 top-2 bottom-2 bg-nature-primary text-white px-6 rounded-xl font-bold">등록/참석</button>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="bg-white/80 px-6 py-3 rounded-2xl border shadow-sm text-center">
                    <span class="text-slate-400 font-bold text-xs">현재 참석</span>
                    <span id="present-count" class="text-nature-primary text-2xl font-black block">0</span>
                </div>
                <button onclick="toggleAdminView()" class="w-14 h-14 bg-white rounded-2xl text-slate-300 border hover:text-nature-primary transition-all"><i class="fas fa-gear text-2xl"></i></button>
            </div>
        </div>
    </nav>

    <div class="max-w-[1600px] mx-auto p-8">
        <div id="admin-panel" class="hidden mb-10 bg-amber-50/90 border border-amber-100 rounded-3xl p-6 shadow-md">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black text-amber-900"><i class="fas fa-user-shield mr-2"></i> 관리자 도구</h2>
                <button onclick="resetData()" class="text-red-500 font-bold text-sm underline">전체 데이터 초기화(주의)</button>
            </div>
            
            <div class="bg-white p-5 rounded-2xl border border-amber-200 mb-6">
                <h3 class="font-bold text-slate-700 mb-3"><i class="fas fa-user-plus mr-2 text-red-500"></i> 이번에 새로 등록된 식구</h3>
                <div id="new-members-list" class="flex flex-wrap gap-2 text-sm">
                    </div>
            </div>
            <p class="text-xs text-amber-700 italic">* 관리자 모드에서는 카드 상단의 편집/삭제 버튼을 사용할 수 있습니다.</p>
        </div>

        <div id="member-list" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-8 gap-5"></div>
    </div>

    <script>
        const ADMIN_PW = "1234";
        let isAdmin = false;

        // 1. 초기 식구 목록 (저장된 데이터가 없을 때만 사용)
        const defaultMembers = ["황복희", "김가윤", "황효미", "간다메구미", "김대성", "마루야마 치요에", "후쿠하라 아야꼬", "오오타 도모꼬", "모리 레이꼬", "미야자또 유리꼬", "이께가미 노리꼬", "후지이 사찌꼬", "오오시로 레이꼬", "노모또 마사꼬", "호시노 마사애", "시미즈 마유미", "코지마 마키", "리리오 만타라", "고이데 케에꼬", "니시야마 치요", "아카기 유카"];

        // 2. 로컬 스토리지에서 데이터 불러오기
        let familyMembers = JSON.parse(localStorage.getItem('church_members')) || defaultMembers;
        let attendanceData = JSON.parse(localStorage.getItem('church_attendance')) || {};
        let newMembers = JSON.parse(localStorage.getItem('new_members')) || []; // 새식구 추적용

        function init() {
            updateClock(); setInterval(updateClock, 1000);
            render();
            document.getElementById('self-member-name').addEventListener('keypress', (e) => e.key === 'Enter' && selfRegister());
        }

        function saveData() {
            localStorage.setItem('church_members', JSON.stringify(familyMembers));
            localStorage.setItem('church_attendance', JSON.stringify(attendanceData));
            localStorage.setItem('new_members', JSON.stringify(newMembers));
        }

        function selfRegister() {
            const input = document.getElementById('self-member-name');
            const name = input.value.trim();
            if(!name) return;

            // 기존 목록에 없으면 새식구로 등록
            if(!familyMembers.includes(name)) {
                familyMembers.push(name);
                newMembers.push(name); // 새식구 리스트에도 추가
                alert(`${name} 식구님, 환영합니다! 명단에 등록되었습니다.`);
            }
            
            attendanceData[name] = true; // 바로 참석 처리
            saveData();
            render();
            input.value = '';
            runConfetti();
        }

        function handleAttendance(name) {
            if(isAdmin) return;
            attendanceData[name] = !attendanceData[name];
            saveData();
            render();
            if(attendanceData[name]) runConfetti();
        }

        function editMember(oldName, event) {
            event.stopPropagation();
            const newName = prompt(`'${oldName}' 식구님의 성함을 수정하시겠습니까?`, oldName);
            if (newName && newName.trim() !== "" && newName !== oldName) {
                const index = familyMembers.indexOf(oldName);
                if (index !== -1) {
                    familyMembers[index] = newName.trim();
                    // 참석 데이터 및 새식구 리스트도 함께 변경
                    if (attendanceData[oldName]) { attendanceData[newName.trim()] = true; delete attendanceData[oldName]; }
                    const newIdx = newMembers.indexOf(oldName);
                    if (newIdx !== -1) newMembers[newIdx] = newName.trim();
                    
                    saveData(); render();
                }
            }
        }

        function removeMember(name, event) {
            event.stopPropagation();
            if(confirm(`'${name}' 식구님을 명단에서 삭제할까요?`)) {
                familyMembers = familyMembers.filter(m => m !== name);
                newMembers = newMembers.filter(m => m !== name);
                delete attendanceData[name];
                saveData(); render();
            }
        }

        function render() {
            const listDiv = document.getElementById('member-list');
            const newMListDiv = document.getElementById('new-members-list');
            listDiv.innerHTML = '';
            newMListDiv.innerHTML = newMembers.length > 0 ? '' : '<span class="text-slate-400">새로 등록된 식구가 없습니다.</span>';

            // 새식구 관리자 페이지 표시
            newMembers.forEach(m => {
                const span = document.createElement('span');
                span.className = "bg-red-50 text-red-600 px-3 py-1 rounded-full border border-red-100 font-bold";
                span.innerText = m;
                newMListDiv.appendChild(span);
            });

            let count = 0;
            [...new Set(familyMembers)].sort().forEach(name => {
                const isPresent = attendanceData[name];
                const isNew = newMembers.includes(name);
                if(isPresent) count++;
                
                const nameParts = name.split(' ');
                const nameHtml = nameParts.length > 1 
                    ? nameParts.map(p => `<span class="block">${p}</span>`).join('')
                    : name;

                const card = document.createElement('div');
                card.className = `member-card cursor-pointer rounded-3xl p-4 text-center font-black relative border-2 ${isPresent ? 'present' : 'border-white text-slate-300'}`;
                
                card.innerHTML = `
                    ${isNew ? '<span class="new-badge">NEW</span>' : ''}
                    ${isAdmin ? `
                        <div class="absolute top-2 right-2 flex gap-1 z-10">
                            <button onclick="editMember('${name}', event)" class="w-7 h-7 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center text-[10px]"><i class="fas fa-pen"></i></button>
                            <button onclick="removeMember('${name}', event)" class="w-7 h-7 bg-red-100 text-red-500 rounded-full flex items-center justify-center text-[10px]"><i class="fas fa-trash"></i></button>
                        </div>
                    ` : ''}
                    <div class="${nameParts.length > 1 ? 'text-lg' : 'text-xl'}">${nameHtml}</div>
                `;
                card.onclick = () => handleAttendance(name);
                listDiv.appendChild(card);
            });
            document.getElementById('present-count').innerText = count;
        }

        function toggleAdminView() {
            if(!isAdmin) {
                if(prompt("관리자 암호:") === ADMIN_PW) { isAdmin = true; document.getElementById('admin-panel').classList.remove('hidden'); }
            } else { isAdmin = false; document.getElementById('admin-panel').classList.add('hidden'); }
            render();
        }

        function resetData() {
            if(confirm("모든 이름 변경과 새식구 기록을 초기화하고 처음으로 되돌릴까요?")) {
                localStorage.clear();
                location.reload();
            }
        }

        function updateClock() { document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('ko-KR', { hour12: false }); }
        function runConfetti() { confetti({ particleCount: 100, spread: 70, origin: { y: 0.8 } }); }

        init();
    </script>
</body>
</html>
